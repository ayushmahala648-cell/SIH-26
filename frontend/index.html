  <body>
    <div class="top-bar">
        <div id="title">परिधि</div>
    </div>

    <h1>Upload Drone Image</h1>
    <p>Upload a high-quality drone image to start mapping parcels</p>

    <div class="uploadArea">
        <button id="plus" onClick="openDrawer()">+</button>
        <div class="uploadText">
        <h2 >Drag & drop your image here</h2>
        <p id="orClick">or click to browse</p>
          <div id="PNG">PNG,JPG,JPEG | Max 10 MB</div>
        </div>
        
    </div>
    <button id="upload-btn" onClick="closeDrawer()"><i class="fa-solid fa-upload"></i>Upload Image</button>
    
    

     <div class="drawer" id="drawer">
       <button id="closeBtn" onClick="closeDrawer()">x</button>
       <div id="drawerText">Select the Aerial Image</div>
       <h2 id="underline"></h2>
       <div class="images">
       <img src="./images/aerialPhoto1.jpg.jpeg"  >
        

      
       <img src="images/aerialPhoto2.jpg.jpeg"   >
        

        
       <img src="images/aerialPhoto3.jpg.jpeg"  >
        

        
       <img src="images/aerialPhoto4.jpg.jpeg"  >
